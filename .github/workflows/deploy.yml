name: Deploy PlanWise

on:
  push:
    branches: [main]

env:
  DEPLOY_PATH: /opt/planwise

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AI_CLAUDE_API_KEY: ${{ secrets.AI_CLAUDE_API_KEY }}
          AI_CLAUDE_MODEL: ${{ secrets.AI_CLAUDE_MODEL }}
          AI_CLAUDE_URL: ${{ secrets.AI_CLAUDE_URL }}
          VNPAY_RETURN_URL: ${{ secrets.VNPAY_RETURN_URL }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          PAYOS_RETURN_URL: ${{ secrets.PAYOS_RETURN_URL }}
          PAYOS_CANCEL_URL: ${{ secrets.PAYOS_CANCEL_URL }}
          PAYOS_WEBHOOK_URL: ${{ secrets.PAYOS_WEBHOOK_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          env | grep -E '^(SPRING_|JWT_|GOOGLE_|VITE_|R2_|AI_|VNPAY_|PAYOS_|CORS_)' > .env
          echo "SERVER_PORT=8000" >> .env
          echo "HTTP_PORT=3000" >> .env
          echo "R2_ENABLED=true" >> .env
          echo "R2_REGION=auto" >> .env
          echo "R2_PRESIGN_TTL_SECONDS=300" >> .env
          echo "R2_MAX_UPLOAD_SIZE_BYTES=5242880" >> .env

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2217
          source: ".,!.git,!node_modules,!be/target,!fe/node_modules"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2217
          script: |
            cd ${{ env.DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml pull 2>/dev/null || true
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
