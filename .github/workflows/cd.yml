name: CI/CD - Docker Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Build frontend
        working-directory: fe
        run: |
          npm ci
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: be/pom.xml

      - name: Build backend
        run: mvn -B -q -f be/pom.xml -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.be
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Verify frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fe
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy production
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust deployment server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-2217}"
          mkdir -p ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy exact commit with rollback
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-2217}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'DEPLOY_SCRIPT'
          set -Eeuo pipefail

          cd "$DEPLOY_PATH"
          test -f .env || { echo "Missing $DEPLOY_PATH/.env"; exit 1; }
          export ENV_FILE=.env

          previous_sha=$(git rev-parse HEAD 2>/dev/null || true)

          rollback() {
            trap - ERR
            echo "Deployment failed; rolling back to $previous_sha"
            if [ -n "$previous_sha" ]; then
              git reset --hard "$previous_sha"
              docker compose -f docker-compose.prod.yml build
              docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
            fi
          }
          trap rollback ERR

          git fetch --prune origin main
          git cat-file -e "$DEPLOY_SHA^{commit}"
          git reset --hard "$DEPLOY_SHA"

          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml build --pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
          docker image prune -f || true

          trap - ERR
          docker compose -f docker-compose.prod.yml ps
          DEPLOY_SCRIPT

      - name: Deployment summary
        run: |
          echo "## Docker deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Server: \`${{ vars.DEPLOY_HOST }}\`" >> "$GITHUB_STEP_SUMMARY"
