spring:
  application:
    name: planwise

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://hikari2004.ddns.net:5417/planwise}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Duykhanh@0915232119}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate            # Tạm cho local/dev tự tạo bảng thiếu, có thể đổi lại validate sau khi sync schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  sql:
    init:
      mode: always

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:hausieucapvippro13@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:pdup lbog nbcv likj}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
              - https://www.googleapis.com/auth/calendar
            redirect-uri: "{baseUrl}/api/v1/oauth2/callback/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

app:
  jwt:
    secret: ${JWT_SECRET:ZmFrZS1zZWNyZXQtZm9yLWRldi1tdXN0LWJlLWF0LWxlYXN0LTUxMi1iaXRzLWxvbmctcGxhbndpc2UtcHJvamVjdC1hcHAtc2Vj}
    access-token-expiration-ms: 900000        # 15 phút
    refresh-token-expiration-ms: 604800000    # 7 ngày

  oauth2:
    authorized-redirect-uris:
      - ${APP_FRONTEND_URL:http://planwise.q2k.click}/auth/callback
      - ${APP_FRONTEND_URL:http://localhost:5173}/auth/callback

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  mail:
    from: ${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:no-reply@planwise.q2k.click}}
    verification-base-url: ${APP_FRONTEND_URL:http://planwise.q2k.click}/verify-email
    verification-token-expiration-minutes: ${APP_MAIL_VERIFICATION_TOKEN_EXPIRATION_MINUTES:60}

  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment/result}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment/result}
    webhook-url: ${PAYOS_WEBHOOK_URL:http://localhost:8080/api/v1/subscriptions/payos-webhook}
    log-level: ${PAYOS_LOG_LEVEL:info}

  r2:
    enabled: ${R2_ENABLED:false}
    endpoint: ${R2_ENDPOINT:}
    region: ${R2_REGION:auto}
    bucket: ${R2_BUCKET:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    presign-ttl-seconds: ${R2_PRESIGN_TTL_SECONDS:300}
    max-upload-size-bytes: ${R2_MAX_UPLOAD_SIZE_BYTES:5242880}

  ai:
    claude:
      api-key: ${AI_CLAUDE_API_KEY:}
      model: ${AI_CLAUDE_MODEL:claude-sonnet-4-6}
      url: ${AI_CLAUDE_URL:https://modelapi.vn/v1/messages}
      max-tokens: ${AI_CLAUDE_MAX_TOKENS:4096}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    com.exe201.planwise: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN


