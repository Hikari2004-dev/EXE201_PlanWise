services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.be
    container_name: planwise-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://planwise.q2k.click}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.fe
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: planwise-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://192.168.1.218:8080
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://planwise.q2k.click}
    depends_on:
      - backend
