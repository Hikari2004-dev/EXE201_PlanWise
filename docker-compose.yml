services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.be
    container_name: planwise-backend
    restart: unless-stopped
    env_file:
      - be/.env
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.fe
    container_name: planwise-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
