services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.be
    container_name: planwise-backend
    restart: unless-stopped
    env_file:
      - be/.env
    environment:
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://192.168.1.218:5173/}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.fe
    container_name: planwise-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://192.168.1.218:8080
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://192.168.1.218:5173}
    depends_on:
      - backend
