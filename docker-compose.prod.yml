name: planwise

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.be
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-be/.env}
    environment:
      SERVER_PORT: 8080
    expose:
      - "8080"
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.fe
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-5173}:80"
    logging: *default-logging
